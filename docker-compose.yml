services:
  # ==========================================
  # INGESTION & EVENT BACKBONE: APACHE ROCKETMQ
  # ==========================================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: logistics-namesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq_namesrv_data:/home/rocketmq/logs
    environment:
      - MAX_HEAP_SIZE=256M
      - HEAP_NEWSIZE=128M
    command: sh mqnamesrv
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: logistics-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - rocketmq_broker_data:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:9876
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=256M
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10911 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # REAL-TIME PROCESSING BACKBONE: APACHE FLINK
  # ==========================================
  flink-jobmanager:
    image: flink:1.19.0-scala_2.12-java17
    container_name: logistics-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - flink_shared_storage:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  flink-taskmanager:
    image: flink:1.19.0-scala_2.12-java17
    container_name: logistics-flink-taskmanager
    ports:
      - "6121:6121"
      - "6122:6122"
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
    volumes:
      - flink_shared_storage:/opt/flink/checkpoints
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6122 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # OFFLINE BACKEND STORAGE: APACHE COUCHDB
  # ==========================================
  couchdb:
    image: couchdb:3.3.3
    container_name: logistics-couchdb
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=secretpassword
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://admin:secretpassword@localhost:5984/_up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==========================================
  # KNOWLEDGEBASE & VECTOR SEARCH: QDRANT
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: logistics-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # PRIVATE LLM SERVER: OLLAMA
  # ==========================================
  ollama:
    image: ollama/ollama:0.1.48
    container_name: logistics-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - logistics-platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  logistics-platform-network:
    driver: bridge

volumes:
  rocketmq_namesrv_data:
  rocketmq_broker_data:
  rocketmq_broker_logs:
  flink_shared_storage:
  flink_savepoints:
  couchdb_data:
  qdrant_storage:
  ollama_storage:
